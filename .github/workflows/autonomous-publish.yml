name: Autonomous Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"
    - cron: "23 13 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out public site source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run autonomous maintenance
        run: python scripts/maintenance.py --out reports
      - name: Build static site
        run: python scripts/build.py --out site --automation-report reports/automation-report.json
      - name: Validate generated site
        run: python scripts/validate.py --dist site
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
